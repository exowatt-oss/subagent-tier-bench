name: CI
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and validate tasks
        run: |
          python -m compileall -q bench.py tasks
          python bench.py --help
          python bench.py selftest
